<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>PawnScope</title>
  <meta name="description" content="Review your Chess.com games with Stockfish in your browser: move classifications, an analyst that explains every move, arrows on the board and accuracy stats." />
  <meta name="theme-color" content="#11151c" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='9' r='5' fill='%2322a35a'/><path d='M10 28h12l-2-9h-8z' fill='%2322a35a'/><path d='M8 30h16' stroke='%2322a35a' stroke-width='3'/></svg>" />
  <!-- Apply the saved theme before first paint to avoid a light/dark flash. -->
  <script>try { const t = localStorage.getItem('pawnscope-theme'); if (t) document.documentElement.dataset.theme = t; } catch {}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#" id="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="9" r="5" /><path d="M10 28h12l-2-9h-8z" /><path d="M8 30h16" class="base" /></svg>
      <span>Pawn<b>Scope</b></span>
    </a>
    <div class="controls">
      <button class="icon-btn" id="sound-toggle" type="button" data-i18n-aria="Sound" aria-label="Sound" aria-pressed="true">
        <svg class="i-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z" /><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11" /></svg>
        <svg class="i-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z" /><path d="M17 9l5 6M22 9l-5 6" /></svg>
      </button>
      <button class="icon-btn" id="theme-toggle" type="button" data-i18n-aria="Change theme" aria-label="Change theme">
        <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg>
        <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" /></svg>
      </button>
      <label class="lang">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" /><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18" /></svg>
        <select id="lang-select" data-i18n-aria="Language" aria-label="Language"></select>
      </label>
    </div>
  </header>

  <main>
    <!-- GAMES -->
    <section id="view-games">
      <div class="hero">
        <h1 data-i18n="hero.title">Review your Chess.com games with Stockfish</h1>
        <p class="lead" data-i18n="hero.lead"></p>
      </div>

      <form class="panel search" id="user-form">
        <label class="grow"><span data-i18n="Chess.com username">Chess.com username</span>
          <input id="username" autocomplete="username" spellcheck="false" autocapitalize="off" placeholder="hikaru" required />
        </label>
        <button id="load-btn" data-i18n="Load games">Load games</button>
      </form>
      <p class="error" id="games-error" role="alert"></p>

      <details class="panel pgn-box">
        <summary data-i18n="or paste a PGN">or paste a PGN</summary>
        <textarea id="pgn-input" rows="6" spellcheck="false" placeholder='[Event "Live Chess"]&#10;1. e4 e5 2. Nf3 Nc6 3. Bb5 a6 *'></textarea>
        <div class="actions"><button id="pgn-btn" type="button" data-i18n="Analyze PGN">Analyze PGN</button></div>
      </details>

      <div id="games-area" hidden>
        <div class="filters">
          <div class="seg" role="group" data-i18n-aria="Time control" id="f-time">
            <button type="button" data-v="all" aria-pressed="true" data-i18n="All">All</button>
            <button type="button" data-v="bullet" aria-pressed="false" data-i18n="Bullet">Bullet</button>
            <button type="button" data-v="blitz" aria-pressed="false" data-i18n="Blitz">Blitz</button>
            <button type="button" data-v="rapid" aria-pressed="false" data-i18n="Rapid">Rapid</button>
            <button type="button" data-v="daily" aria-pressed="false" data-i18n="Daily">Daily</button>
          </div>
          <div class="seg" role="group" data-i18n-aria="Result" id="f-result">
            <button type="button" data-v="all" aria-pressed="true" data-i18n="All">All</button>
            <button type="button" data-v="win" aria-pressed="false" data-i18n="Wins">Wins</button>
            <button type="button" data-v="loss" aria-pressed="false" data-i18n="Losses">Losses</button>
            <button type="button" data-v="draw" aria-pressed="false" data-i18n="Draws">Draws</button>
          </div>
          <span class="count" id="games-count"></span>
        </div>
        <ul class="game-list" id="game-list"></ul>
      </div>
    </section>

    <!-- REVIEW -->
    <section id="view-review" hidden>
      <div class="review-head">
        <button class="ghost" id="back-btn" type="button">← <span data-i18n="Games">Games</span></button>
        <div class="review-title" id="review-title"></div>
        <a class="ghost-link" id="open-link" target="_blank" rel="noopener" hidden data-i18n="Open on Chess.com">Open on Chess.com</a>
      </div>

      <div class="review">
        <div class="board-col">
          <div class="player-tag" id="tag-top"></div>
          <div class="board-wrap">
            <div class="evalbar" id="evalbar" aria-hidden="true"><div class="evalbar-fill" id="evalbar-fill"></div><span id="evalbar-label">0.0</span></div>
            <div class="board-host" id="board-host"><svg class="board" id="board" viewBox="0 0 800 800" role="img" aria-label="Chessboard"></svg></div>
          </div>
          <div class="player-tag" id="tag-bottom"></div>
          <div class="nav">
            <button class="ghost" type="button" id="nav-first" data-i18n-aria="First move" aria-label="First move">⏮</button>
            <button class="ghost" type="button" id="nav-prev" data-i18n-aria="Previous move" aria-label="Previous move">◀</button>
            <button class="ghost" type="button" id="nav-next" data-i18n-aria="Next move" aria-label="Next move">▶</button>
            <button class="ghost" type="button" id="nav-last" data-i18n-aria="Last move" aria-label="Last move">⏭</button>
            <button class="ghost" type="button" id="nav-flip" data-i18n-aria="Flip board" aria-label="Flip board">⇅</button>
          </div>
        </div>

        <div class="side-col">
          <div class="panel progress-panel">
            <div class="progress-row">
              <span id="progress-text" aria-live="polite"></span>
              <label class="inline"><span data-i18n="Depth">Depth</span>
                <select id="depth"><option value="10">10</option><option value="14" selected>14</option><option value="18">18</option></select>
              </label>
            </div>
            <div class="progress"><span id="progress-bar"></span></div>
          </div>

          <div class="panel analyst">
            <div class="analyst-head">
              <span class="avatar" aria-hidden="true">♞</span>
              <b data-i18n="Analyst">Analyst</b>
              <span class="cls-pill" id="analyst-cls"></span>
            </div>
            <div id="analyst-text" aria-live="polite"></div>
            <p class="engine-line" id="engine-line"></p>
            <label class="inline show-best"><input type="checkbox" id="show-best" checked /> <span data-i18n="Show best move">Show best move</span></label>
          </div>

          <div class="panel">
            <h3 data-i18n="Moves">Moves</h3>
            <ol class="moves" id="moves"></ol>
          </div>
        </div>
      </div>

      <div class="panel">
        <h3 data-i18n="Evaluation">Evaluation</h3>
        <svg class="graph" id="graph" viewBox="0 0 600 120" preserveAspectRatio="none" aria-hidden="true"></svg>
      </div>

      <div class="panel">
        <h3 data-i18n="Summary">Summary</h3>
        <div id="summary"></div>
      </div>
    </section>
  </main>

  <footer class="foot">
    <p data-i18n="foot.note"></p>
    <p><span data-i18n="Built by">Built by</span> <a href="https://github.com/jheremysebastian17">Jheremy Sánchez</a> · <a href="https://github.com/jheremysebastian17/pawnscope" data-i18n="Source on GitHub">Source on GitHub</a></p>
  </footer>
  <script type="module" src="js/app.js"></script>
</body>
</html>
